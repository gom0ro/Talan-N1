{% comment %}
Аттестация аккордеоны мен құжат көрсету терезесінің JS логікасы.
{% endcomment %}
<script>
  (function () {
    var blocks = document.querySelectorAll('.att-block');

    blocks.forEach(function (block) {
      var btn = block.querySelector('.att-cat-btn');
      var panel = block.querySelector('.att-panel');
      if (!btn || !panel) return;

      var openState = btn.getAttribute('aria-expanded') === 'true';
      block.classList.toggle('is-open', openState);
      panel.style.maxHeight = openState ? 'none' : '0px';

      btn.addEventListener('click', function () {
        var isOpen = btn.getAttribute('aria-expanded') === 'true';

        blocks.forEach(function (other) {
          if (other === block) return;
          var otherBtn = other.querySelector('.att-cat-btn');
          var otherPanel = other.querySelector('.att-panel');
          if (!otherBtn || !otherPanel || otherBtn.getAttribute('aria-expanded') !== 'true') return;
          otherBtn.setAttribute('aria-expanded', 'false');
          other.classList.remove('is-open');
          otherPanel.style.maxHeight = otherPanel.scrollHeight + 'px';
          requestAnimationFrame(function () {
            otherPanel.style.maxHeight = '0px';
          });
        });

        btn.setAttribute('aria-expanded', String(!isOpen));
        block.classList.toggle('is-open', !isOpen);

        if (isOpen) {
          panel.style.maxHeight = panel.scrollHeight + 'px';
          requestAnimationFrame(function () {
            panel.style.maxHeight = '0px';
          });
        } else {
          panel.style.maxHeight = panel.scrollHeight + 'px';
          panel.addEventListener('transitionend', function onEnd(event) {
            if (event.propertyName !== 'max-height') return;
            if (btn.getAttribute('aria-expanded') === 'true') panel.style.maxHeight = 'none';
            panel.removeEventListener('transitionend', onEnd);
          });
        }
      });
    });

    window.addEventListener('resize', function () {
      blocks.forEach(function (block) {
        var btn = block.querySelector('.att-cat-btn');
        var panel = block.querySelector('.att-panel');
        if (!btn || !panel) return;
        if (btn.getAttribute('aria-expanded') === 'true') panel.style.maxHeight = 'none';
      });
    });

    /* ─── Құжатты модаль терезеде көрсету ─────────────────── */
    var modal = document.getElementById('attModal');
    if (!modal) return;

    var frame = document.getElementById('attModalFrame');
    var image = document.getElementById('attModalImage');
    var modalTitle = document.getElementById('attModalTitle');
    var download = document.getElementById('attModalDownload');
    var lastFocused = null;

    function openViewer(trigger) {
      var url = trigger.getAttribute('data-url');
      if (!url) return;

      lastFocused = trigger;
      modalTitle.textContent = trigger.getAttribute('data-title') || 'Құжат';
      download.href = trigger.getAttribute('data-raw') || url;

      var isImage = trigger.getAttribute('data-type') === 'image';
      if (isImage) {
        image.src = url;
        image.hidden = false;
        frame.hidden = true;
      } else {
        frame.src = url;
        frame.hidden = false;
        image.hidden = true;
      }

      modal.hidden = false;
      document.body.classList.add('att-modal-open');
      modal.querySelector('.att-modal-x').focus();
    }

    function closeViewer() {
      modal.hidden = true;
      document.body.classList.remove('att-modal-open');
      /* iframe-ті тастау — жүктелуді тоқтатып, серверді босатады */
      frame.removeAttribute('src');
      image.removeAttribute('src');
      if (lastFocused) lastFocused.focus();
    }

    document.querySelectorAll('[data-att-view]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openViewer(btn);
      });
    });

    modal.querySelectorAll('[data-att-close]').forEach(function (el) {
      el.addEventListener('click', closeViewer);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !modal.hidden) closeViewer();
    });

    /* ─── Якорь арқылы нақты санатты ашу (#att-block-<id>) ── */
    function openFromHash() {
      var id = window.location.hash.slice(1);
      if (!id) return;
      var block = document.getElementById(id);
      if (!block) return;

      var targetBtn = block.querySelector('.att-cat-btn');
      var targetPanel = block.querySelector('.att-panel');
      if (!targetBtn || !targetPanel) return;

      if (targetBtn.getAttribute('aria-expanded') !== 'true') targetBtn.click();

      var top = block.getBoundingClientRect().top + window.pageYOffset - 24;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', openFromHash);
    openFromHash();
  })();
</script>
